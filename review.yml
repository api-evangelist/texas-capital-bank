    type: Documentation
    note: Bank's API product page — markets ConnectNow, platform integrations, custom APIs, SFTP/XChange; "Contact Our Experts" flow, no self-serve docs or spec.
  - url: https://texascapitalbank.com/who-we-serve/business/homebuilders-developers
    type: Website
