name: Texas Capital Bank
kind: company
description: >-
  Texas Capital Bank, National Association is the banking subsidiary of Texas
  Capital Bancshares, Inc. (NASDAQ: TCBI), a Dallas-headquartered full-service
  financial services firm founded in 1998 with roughly $31.5 billion in assets
  (FYE 2025). As a nationally chartered commercial bank it serves businesses,
  entrepreneurs, and institutions across Texas and the United States with
  commercial and business banking, treasury management, mortgage/warehouse
  finance, and investment banking. On the open-finance dimension the bank is
  relationship-first rather than developer-first: it markets treasury and ERP
  API integrations (including its ConnectNow embedded banking for Sage and
  NetSuite, direct platform integrations, and SFTP/XChange file transfer) but
  exposes them through partner onboarding with dedicated bankers, not a public
  self-serve developer portal. There is no public first-party developer portal,
  no downloadable OpenAPI/Swagger, and no self-serve API signup. Consumer
  account and transaction data is made available to permissioned third parties
  through the Finicity (Mastercard) aggregator rather than a first-party API,
  which is the honest posture for most US regional banks under the voluntary,
  fragmented US open-banking landscape (CFPB Section 1033 and the industry FDX
  standard).
